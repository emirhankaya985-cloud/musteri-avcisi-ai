name: OSM Durable Tile Live Acceptance
on:
  # One controlled live acceptance when this workflow is first merged.
  push:
    branches: [main]
    paths: ['.github/workflows/osm-tile-live-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-lead-digest
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check synthetic tests before any live traffic
        run: python tools/codex_acceptance.py
      - name: Install existing free reader dependencies
        run: python -m pip install 'psycopg[binary]==3.2.12' 'dnspython==2.8.0'
      - name: Scan at most two current-region tiles and send only confirmed new leads to owner
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_ROTATE_BBOX: 'true'
          SCAN_TILE_LEDGER: 'true'
          OSM_SOURCE_MODE: 'direct'
          OWNER_HOURLY_SUMMARY: 'false'
          OWNER_ERROR_ALERT_DAILY_GUARD: 'true'
          MAIL_PREVIEW_IN_TELEGRAM: 'false'
          AUTO_MAIL_ENABLED: 'false'
          DIGEST_DAILY_GUARD: 'false'
        run: python -m leadhunter.daily_scan
      - name: Commit only public OSM ID and tile cursor state
        if: always()
        run: |
          git add data/seen.json
          if [ -f data/osm_tile_progress.json ]; then
            git add data/osm_tile_progress.json
          fi
          if [ -f data/last_scan_alert.json ]; then
            git add data/last_scan_alert.json
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: record verified OSM tile cursor and owner sends"
            git push
          fi
