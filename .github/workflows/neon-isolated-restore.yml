name: Neon Isolated Restore Acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/neon-isolated-restore.yml']
  workflow_dispatch:
  # Verify that current production can STILL be restored to a disposable
  # database once a week; do not retain or upload any customer archive.
  schedule:
    - cron: '27 2 * * 0'
permissions:
  contents: read
concurrency:
  group: musteri-avcisi-neon-restore-readonly
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install free Python reader; reuse existing postgres:16 image
        run: python -m pip install -q 'psycopg[binary]==3.2.12'
      - name: Read-only production dump, isolated local restore, private full-row comparison
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          ISOLATED_POSTGRES_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/synthetic
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REVIEW_DATABASE_URL" || { echo "RESTORE_ACCEPTANCE: unconfigured"; exit 1; }
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          # No raw data, connection strings or archives printed/uploaded.
          # The Postgres 16 image is already pulled for the temporary service.
          if ! docker run --rm --network host --user "$(id -u):$(id -g)" --env REVIEW_DATABASE_URL --volume "$WORKDIR:/backup:rw" postgres:16 bash -c 'pg_dump --format=custom --no-owner --no-acl --schema=public --file=/backup/backup.dump "$REVIEW_DATABASE_URL" >/dev/null 2>&1'; then
            echo 'RESTORE_ACCEPTANCE: dump_unavailable; no production writes'
            exit 1
          fi
          if ! docker run --rm --network host --user "$(id -u):$(id -g)" --env ISOLATED_POSTGRES_URL --volume "$WORKDIR:/backup:ro" postgres:16 bash -c 'pg_restore --clean --if-exists --no-owner --no-privileges --exit-on-error --dbname="$ISOLATED_POSTGRES_URL" /backup/backup.dump >/dev/null 2>&1'; then
            echo 'RESTORE_ACCEPTANCE: restore_unavailable; production unchanged'
            exit 1
          fi
          python -m leadhunter.restore_acceptance
