name: Controlled Eligible Business Outreach
# Public-source contact research happens first; recipient eligibility and sender
# reputation are rechecked at the final atomic SMTP claim.
on:
  workflow_dispatch:
  schedule:
    # After the daily 10-site research batch; max five eligible business emails.
    - cron: '45 4 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/execute-outreach.yml']
permissions:
  contents: read
concurrency:
  group: telegram-lead-digest
  cancel-in-progress: false
jobs:
  catch-up:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-owner-outreach-20261029]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify offline acceptance before sending
        run: python tools/codex_acceptance.py
      - name: Install private storage driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Rehearse recipient eligibility and sender circuit; no SMTP
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        run: python -m leadhunter.recipient_audit --dry-run
      - name: Send at most five eligible business contacts and report content privately
        env:
          MAIL_BATCH_LIMIT: '5'
          AUTO_MAIL_DAILY_LIMIT: '5'
          AUTO_MAIL_ENABLED: 'true'
          MAIL_DRAFT_MODE: template
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_BBOX: ${{ vars.SCAN_BBOX }}
        run: python -m leadhunter.mail_batch
