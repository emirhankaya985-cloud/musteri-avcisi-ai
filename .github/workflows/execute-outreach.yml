name: Owner Requested Mail Catch-up
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/execute-outreach.yml']
permissions:
  contents: read
concurrency:
  group: telegram-lead-digest
  cancel-in-progress: false
jobs:
  catch-up:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-owner-outreach-20261029]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify offline acceptance before sending
        run: python tools/codex_acceptance.py
      - name: Install private storage driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Verify actual Gmail SMTP with one owner-to-self email
        env:
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SELF_TEST_APPROVED: YES_ONE_EMAIL_TO_MYSELF
        run: python -m leadhunter.gmail_selftest send-to-self
      - name: Send existing and current business offers and report exact content privately
        env:
          AUTO_MAIL_ENABLED: 'true'
          MAIL_DRAFT_MODE: template
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_BBOX: ${{ vars.SCAN_BBOX }}
        run: python -m leadhunter.mail_batch
