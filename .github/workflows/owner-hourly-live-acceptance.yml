name: Owner Hourly Summary Live Acceptance
on:
  # Automatically verify the real hourly report pipeline once on first merge.
  push:
    branches: [main]
    paths: ['.github/workflows/owner-hourly-live-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-lead-digest
  cancel-in-progress: false
jobs:
  owner-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check offline safety guards
        run: python tools/codex_acceptance.py
      - name: Install free private driver and DNS preflight
        run: python -m pip install 'psycopg[binary]==3.2.12' 'dnspython==2.8.0'
      - name: Verify owner-only secrets exist without printing values
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$REVIEW_DATABASE_URL" || exit 1
          test -n "$TELEGRAM_BOT_TOKEN" || exit 1
          test -n "$TELEGRAM_CHAT_ID" || exit 1
          echo "OWNER_LIVE_ACCEPTANCE: required secrets present, values not logged"
      - name: Run normal owner-only discovery and real hourly Telegram API receipt
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_ROTATE_BBOX: 'true'
          OWNER_HOURLY_SUMMARY: 'true'
          OWNER_ERROR_ALERT_DAILY_GUARD: 'true'
          DIGEST_DAILY_GUARD: 'false'
          AUTO_MAIL_ENABLED: 'false'
          MAIL_PREVIEW_IN_TELEGRAM: 'false'
          OSM_SOURCE_MODE: auto
        run: python -m leadhunter.daily_scan
      - name: Persist only public seen OSM IDs and owner error-attempt date
        if: always()
        run: |
          git add data/seen.json
          if [ -f data/last_scan_alert.json ]; then
            git add data/last_scan_alert.json
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: retain owner-only live acceptance seen IDs"
            git push
          fi
