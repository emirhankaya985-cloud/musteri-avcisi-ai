name: Offline Tests
on:
  # Start automatically when the repository changes from private to public.
  public:
  push:
    branches: [main]
    # State-only commits from the scheduled bots should not spend CI minutes.
    paths-ignore:
      - 'data/seen.json'
      - 'data/mail_sent.json'
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reject tracked private customer data
        run: |
          blocked="$(git ls-files -- data/approved_recipients.json data/mail_sent.json data/*.private.json)"
          if [ -n "$blocked" ]; then
            echo "::error::Private customer files are tracked in Git; remove them before publishing."
            exit 1
          fi
      - name: Check Python syntax
        run: python -m compileall -q leadhunter tests tools
      - name: Codex acceptance suite (offline, no secrets)
        run: python tools/codex_acceptance.py
