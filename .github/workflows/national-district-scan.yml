name: Manual National OSM District Scan (No Outreach)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/ops/one-time-national-district-scan-20261128.txt']
  schedule:
    # Weekly full-source refresh; the private district ledger resumes only
    # items without a verified receipt.
    - cron: '0 1 * * 0'
permissions:
  contents: read
concurrency:
  # Serialize private CRM insertions with the existing owner OSM scan.
  group: telegram-lead-digest
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned free PBF and geometry dependencies
        run: python -m pip install 'osmium==4.2.0' 'Shapely==2.1.2' 'psycopg[binary]==3.2.12'
      - name: Run offline district scanner regressions
        run: |
          python -m unittest discover -s tests -p 'test_district_pbf_geometry.py' -v
          python -m unittest discover -s tests -p 'test_national_district_scan.py' -v
          python -m unittest discover -s tests -p 'test_province_coverage.py' -v
          python -m unittest discover -s tests -p 'test_province_coverage_store_batch.py' -v
      - name: Verify migration 016, all district plans, and migration 009 before download
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        run: python -m leadhunter.national_district_scan --preflight
      - name: Download and verify the free Geofabrik Turkey PBF
        id: source
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p /tmp/national-osm-district
          cd /tmp/national-osm-district
          url='https://download.geofabrik.de/europe/turkey-latest.osm.pbf'
          curl --fail --location --silent --show-error --retry 1 \
            --connect-timeout 30 --max-time 1200 "$url" -o turkey-latest.osm.pbf
          curl --fail --location --silent --show-error --retry 1 \
            --connect-timeout 30 --max-time 45 "$url.md5" -o turkey-latest.osm.pbf.md5
          md5sum --check turkey-latest.osm.pbf.md5
          test "$(stat -c %s turkey-latest.osm.pbf)" -gt 100000000
          test "$(stat -c %s turkey-latest.osm.pbf)" -le 2147483648
          sha="$(sha256sum turkey-latest.osm.pbf | cut -d' ' -f1)"
          timestamp="$(python -c 'import osmium; r=osmium.io.Reader("turkey-latest.osm.pbf"); print(r.header().get("osmosis_replication_timestamp")); r.close()')"
          test -n "$timestamp"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo 'NATIONAL_PBF_SOURCE: Geofabrik MD5 verified; SHA-256 recorded; timestamp read from PBF header'
      - name: Attribute exact district geometries and commit resumable receipts
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          OSM_PBF_FILE: /tmp/national-osm-district/turkey-latest.osm.pbf
          OSM_PBF_SOURCE_URL: https://download.geofabrik.de/europe/turkey-latest.osm.pbf
          OSM_SNAPSHOT_SHA256: ${{ steps.source.outputs.sha256 }}
          OSM_SNAPSHOT_TIMESTAMP: ${{ steps.source.outputs.timestamp }}
          AUTO_MAIL_ENABLED: 'false'
          OWNER_APPROVED_MAIL_ENABLED: 'false'
          OWNER_NEW_LEAD_NOTICES: 'false'
        run: python -m leadhunter.national_district_scan
      - name: Refresh the private company duplicate review queue
        if: success()
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        run: python -m leadhunter.duplicate_review
