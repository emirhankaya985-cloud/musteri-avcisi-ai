name: Müşteri Avcısı Owner Daily Telegram Summary
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-daily-status.yml']
  schedule:
    - cron: '55 20 * * *' # 23:55 Europe/Istanbul year-round
permissions:
  contents: read
concurrency:
  group: musteri-avcisi-owner-daily-summary
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Owner-only idempotent daily report; no SMTP
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_MAIL_ENABLED: ${{ vars.AUTO_MAIL_ENABLED }}
        run: python -m leadhunter.daily_status
