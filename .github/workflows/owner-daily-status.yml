name: Müşteri Avcısı Owner Daily Telegram Summary
on:
  workflow_dispatch:
  # Istanbul is UTC+3 year-round. GitHub schedule time is UTC.
  schedule:
    - cron: '59 20 * * *' # 23:59 Europe/Istanbul
permissions:
  contents: read
concurrency:
  group: musteri-avcisi-owner-daily-summary
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.12' 'openpyxl==3.1.5'
      - name: Owner-only daily CRM workbook and metrics; no SMTP
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Reporting reads the main workflow's real safety gates; this job
          # has no mailer code and can never send business email.
          AUTO_MAIL_ENABLED: 'true'
          UNIFIED_CONTROL_HTTP_ENABLED: 'true'
        run: python -m leadhunter.daily_status
