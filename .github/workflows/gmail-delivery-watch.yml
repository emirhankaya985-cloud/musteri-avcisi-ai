name: Owner Gmail Delivery Watch (Read Only)
on:
  workflow_dispatch:
  # One-time live acceptance when this workflow changes on main.
  push:
    branches: [main]
    paths: ['.github/workflows/gmail-delivery-watch.yml']
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
concurrency:
  group: owner-readonly-gmail-delivery-watch
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install free private PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Read Gmail IMAP and store owner delivery/reply feedback only
        env:
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m leadhunter.mail_watch
      - name: Refresh owner-only recipient hold evidence after new DSNs (no SMTP)
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        run: python -m leadhunter.recipient_audit
      - name: Evaluate private safety gates (read-only dry run; no SMTP)
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        run: python -m leadhunter.recipient_audit --dry-run
