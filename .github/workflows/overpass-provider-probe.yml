name: Read-only Overpass Alternate Provider Probe
on:
  pull_request:
    paths:
      - 'leadhunter/osm_overpass_tiles.py'
      - '.github/workflows/overpass-provider-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: overpass-provider-probe
  cancel-in-progress: false
jobs:
  one-public-tile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: One bounded public OSM query without Telegram, Neon or SMTP
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import socket
          import ssl
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          # Public global-data Overpass server; one provider, one tile, no retries,
          # no raw objects/contacts in logs, and no secrets or external messages.
          endpoint = "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
          bbox = "40.982,29.145,40.987,29.150"
          q = ("[out:json][timeout:35];("
               'nwr["amenity"="car_wash"]('+bbox+');'
               'nwr["shop"="hairdresser"]('+bbox+');'
               'nwr["shop"="beauty"]('+bbox+');'
               'nwr["shop"="florist"]('+bbox+');'
               'nwr["shop"="optician"]('+bbox+');'
               ");out tags qt;")
          req = Request(
              endpoint, data=urlencode({"data": q}).encode(),
              headers={
                  "User-Agent":"MusteriAvcisiAI/0.3 (single bounded read-only provider check; https://www.openstreetmap.org/copyright)",
                  "Content-Type":"application/x-www-form-urlencoded",
              })
          start = time.monotonic()
          try:
              with urlopen(req, timeout=55) as response:
                  status = response.status
                  payload = response.read(4_000_001)
              if status != 200 or len(payload) > 4_000_000:
                  raise ValueError("invalid_status_or_size")
              body = json.loads(payload)
              if (not isinstance(body,dict) or body.get("remark") or
                      not isinstance(body.get("elements"),list)):
                  raise ValueError("invalid_overpass_body")
              print("OVERPASS_PUBLIC_PROBE: PASS; status=200; elements=" +
                    str(len(body["elements"])) + "; elapsed_s=" + str(round(time.monotonic()-start,1)) + "; one_request=1; private_data=0")
          except HTTPError as exc:
              print("OVERPASS_PUBLIC_PROBE: FAIL; class=http; code=" + str(exc.code))
              raise SystemExit(1)
          except (TimeoutError, socket.timeout):
              print("OVERPASS_PUBLIC_PROBE: FAIL; class=timeout")
              raise SystemExit(1)
          except (URLError, OSError) as exc:
              reason = getattr(exc, "reason", exc)
              category = ("dns" if isinstance(reason, socket.gaierror)
                          else "tls" if isinstance(reason, ssl.SSLError)
                          else "network")
              print("OVERPASS_PUBLIC_PROBE: FAIL; class=" + category)
              raise SystemExit(1)
          except (ValueError, TypeError, UnicodeError):
              print("OVERPASS_PUBLIC_PROBE: FAIL; class=response_invalid")
              raise SystemExit(1)
          PY
