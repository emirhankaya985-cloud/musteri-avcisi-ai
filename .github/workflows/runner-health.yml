name: Runner Health Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check runner availability without secrets
        run: echo "GitHub-hosted runner available"
