name: Read Only Automation Freshness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/read-only-ops-freshness.yml']
  workflow_dispatch:
  # Low-cost watchdog every three hours; no customer messages or retries.
  schedule:
    - cron: '42 */3 * * *'
permissions:
  contents: read
concurrency:
  group: musteri-avcisi-readonly-ops-freshness
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install free private Postgres reader
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Verify real Neon schedule receipts, no scan dispatch or SMTP
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        run: python -m leadhunter.ops_freshness
