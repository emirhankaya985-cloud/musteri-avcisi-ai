name: Historical Business Contact Research (No SMTP)
on:
  workflow_dispatch:
  schedule:
    # One free, bounded research batch per day, before the Istanbul daily report.
    - cron: '15 4 * * *'
permissions:
  contents: read
concurrency:
  group: telegram-lead-digest
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install free private PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Check the bounded researcher offline
        run: python -m unittest discover -s tests -p test_historical_contact_research.py -v
      - name: Research at most ten existing business websites; no SMTP
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          AUTO_MAIL_ENABLED: 'false'
          OWNER_APPROVED_MAIL_ENABLED: 'false'
          MAIL_DRAFT_MODE: 'template'
        run: python -m leadhunter.historical_contact_research
