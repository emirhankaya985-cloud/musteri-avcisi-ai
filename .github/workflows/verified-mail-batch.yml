name: Owner Verified Business Mail Batch
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-lead-digest
  cancel-in-progress: false
jobs:
  verified-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify offline acceptance before any mail
        run: python tools/codex_acceptance.py
      - name: Install private storage driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Send owner-requested researched batch and report full mails privately
        env:
          AUTO_MAIL_ENABLED: 'true'
          MAIL_DRAFT_MODE: template
          OWNER_VERIFIED_BATCH_APPROVED: YES_SEND_UP_TO_15
          OWNER_MAIL_BATCH_JSON: ${{ secrets.OWNER_MAIL_BATCH_JSON }}
          GMAIL_SENDER_ADDRESS: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m leadhunter.verified_batch
