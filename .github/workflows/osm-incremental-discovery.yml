name: OSM Incremental Business Discovery (Private, No Outreach)
on:
  # Free Geofabrik country snapshot at most twice weekly, never hourly.
  # The hourly job continues independent read-only operational checks.
  schedule:
    - cron: '37 3 * * 1,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/ops/one-time-incremental-acceptance-20261116.txt'
permissions:
  contents: read
concurrency:
  # Serializes private CRM insertions with the hourly owner discovery job.
  group: telegram-lead-digest
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify offline incremental and no-rescan regressions
        run: |
          python -m unittest discover -s tests -p 'test_incremental_discovery.py' -v
          python -m unittest discover -s tests -p 'test_tile_progress.py' -v
      - name: Install free Postgres driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Check most recent real snapshot before touching public source
        id: due
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        run: |
          set -euo pipefail
          result="$(python -m leadhunter.incremental_discovery --preflight | tail -n 1)"
          case "$result" in
            true|false) echo "due=$result" >> "$GITHUB_OUTPUT" ;;
            *) echo "Failed to check durable source date"; exit 1 ;;
          esac
      - name: Install free OSM PBF parser only when source is due
        if: steps.due.outputs.due == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python -m pip install 'osmium==4.2.0'
      - name: Download one digest-verified Geofabrik country snapshot when due
        if: steps.due.outputs.due == 'true'
        id: source
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p /tmp/clients-osm-refresh
          cd /tmp/clients-osm-refresh
          url='https://download.geofabrik.de/europe/turkey-latest.osm.pbf'
          curl --fail --location --silent --show-error --retry 1 \
            --connect-timeout 30 --max-time 900 "$url" -o turkey-latest.osm.pbf
          curl --fail --location --silent --show-error --retry 1 \
            --connect-timeout 30 --max-time 45 "$url.md5" -o turkey-latest.osm.pbf.md5
          md5sum --check turkey-latest.osm.pbf.md5
          test "$(stat -c %s turkey-latest.osm.pbf)" -gt 100000000
          echo "sha256=$(sha256sum turkey-latest.osm.pbf | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          stamp="$(osmium fileinfo -g header.option.osmosis_replication_timestamp turkey-latest.osm.pbf)"
          test -n "$stamp"
          echo "timestamp=$stamp" >> "$GITHUB_OUTPUT"
          echo 'INCREMENTAL_SNAPSHOT: country source checksum verified'
      - name: Extract only the existing Istanbul pilot geometry without 402 tile requests
        if: steps.due.outputs.due == 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          osmium extract --bbox 29.015,40.946,29.175,41.031 \
            --strategy=smart --option types=multipolygon \
            -o /tmp/clients-osm-refresh/pilot.osm.pbf \
            /tmp/clients-osm-refresh/turkey-latest.osm.pbf
          test "$(stat -c %s /tmp/clients-osm-refresh/pilot.osm.pbf)" -gt 4096
      - name: Register new IDs and queue changed existing businesses privately
        if: steps.due.outputs.due == 'true'
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          OSM_PILOT_FILE: /tmp/clients-osm-refresh/pilot.osm.pbf
          OSM_SNAPSHOT_SHA256: ${{ steps.source.outputs.sha256 }}
          OSM_SNAPSHOT_TIMESTAMP: ${{ steps.source.outputs.timestamp }}
          AUTO_MAIL_ENABLED: 'false'
          OWNER_APPROVED_MAIL_ENABLED: 'false'
          OWNER_NEW_LEAD_NOTICES: 'false'
        run: python -m leadhunter.incremental_discovery
      - name: Refresh private company duplicate review after the source pass
        if: steps.due.outputs.due == 'true' && success()
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        run: python -m leadhunter.duplicate_review
      - name: Assert historic coverage is still complete without any source tile write
        if: always()
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from leadhunter.review_private import connect_private_database
          db=connect_private_database(os.environ['REVIEW_DATABASE_URL'])
          try:
              with db.cursor() as cur:
                  cur.execute("SELECT count(*) FROM owner_osm_tile_ledger WHERE state='confirmed'")
                  assert int(cur.fetchone()[0])==402, 'Historical OSM coverage changed; stop'
              print('INCREMENTAL_ACCEPTANCE: historical_coverage=402; prior_cells_rescanned=0; outbound_business_mail=0')
          finally:
              db.close()
          PY
