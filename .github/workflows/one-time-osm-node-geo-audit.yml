name: One-time Private CRM Duplicate Position Audit (No Outreach)
on:
  push:
    branches: [main]
    paths:
      - '.github/ops/one-time-osm-node-geo-audit-20261116.txt'
permissions:
  contents: read
# Only one batch of existing OSM IDs; keep private audit writes serialized.
concurrency:
  group: telegram-lead-digest
  cancel-in-progress: false
jobs:
  verify-positions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline one-request and no-merge regressions
        run: python -m unittest discover -s tests -p 'test_duplicate_geo_audit.py' -v
      - name: Install free private Neon driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Verify geographic distance of existing duplicate candidates
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          AUTO_MAIL_ENABLED: 'false'
          OWNER_NEW_LEAD_NOTICES: 'false'
        run: python -m leadhunter.duplicate_geo_audit
      - name: Verify historic CRM and full original tile ledger untouched
        if: always()
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from leadhunter.review_private import connect_private_database
          db=connect_private_database(os.environ['REVIEW_DATABASE_URL'])
          try:
              with db.cursor() as c:
                  c.execute("SELECT count(*),count(DISTINCT osm_id) FROM owner_leads")
                  count,distinct=map(int,c.fetchone())
                  assert (count,distinct)==(390,390),'CRM changed during geo review'
                  c.execute("SELECT count(*) FROM owner_osm_tile_ledger WHERE state='confirmed'")
                  assert int(c.fetchone()[0])==402,'402-cell baseline changed'
              print('GEO_REVIEW_INTEGRITY: CRM=390; distinct=390; coverage=402; smtp_sent=0')
          finally:
              db.close()
          PY
