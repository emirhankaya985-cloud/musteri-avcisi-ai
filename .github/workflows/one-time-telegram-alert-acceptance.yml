name: One-time Owner Telegram Critical Alert Acceptance (No Customers)
on:
  push:
    branches: [main]
    paths:
      - '.github/ops/one-time-telegram-alert-acceptance-20261116.txt'
permissions:
  contents: read
concurrency:
  group: musteri-avcisi-one-time-owner-alert-acceptance
  cancel-in-progress: false
jobs:
  verify-owner-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: No-network idempotency regressions
        run: python -m unittest discover -s tests -p 'test_telegram_live_acceptance.py' -v
      - name: Install free Neon driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Perform one explicitly requested owner-only bot API test
        env:
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_MAIL_ENABLED: 'false'
        run: python -m leadhunter.telegram_live_acceptance
